name: run

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchcodec --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest
      - name: Run core tests
        run: |
          python -m pytest --ignore test/test_convert.py
      - name: Install additional test dependencies
        run: |
          pip install -e '.[test,triton]'
      - name: Run all tests
        run: |
          python -m pytest
      - name: Run Triton kernel tests
        env:
          TRITON_INTERPRET: 1
        run: |
          python -m pytest test/test_viterbi.py -k triton
